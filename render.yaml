services:
  - type: web
    name: play-fingerprint-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: play-fingerprint-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.12.8
databases:
  - name: play-fingerprint-db
    plan: free
