services:
  - type: web
    name: play-fingerprint-server
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: Riskingfire/fingerprints
      - key: GITHUB_BRANCH
        value: main
      - key: GITHUB_FINGERPRINT_DIR
        value: fingerprints
      - key: GITHUB_BANLIST_PATH
        value: banlist.json
      - key: KEY_DEFAULT_DAYS
        value: "60"
      - key: GITHUB_KEYS_PATH
        value: apikeys.json
      # Optional restricted keys (see README section 4). Example:
      # - key: API_KEY1
      #   generateValue: true
      # - key: API_KEY1_PERM
      #   value: "14"
      # - key: API_KEY1_EXPIRES
      #   value: "2027-03-01"   # optional; env keys never expire if this is omitted
      - key: PYTHON_VERSION
        value: 3.12.8
